<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#182234" />
      <stop offset="100%" stop-color="#0a0e17" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Cyber accents -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.35" />

  <!-- Controller / Trophy Combo Icon -->
  <g transform="translate(0, -10)" filter="url(#glow)">
    <!-- Trophy Cup -->
    <path d="M 176 170 C 176 270 236 290 256 290 C 276 290 336 270 336 170 L 336 150 L 176 150 Z" fill="url(#goldGrad)" />
    
    <!-- Trophy Handles -->
    <path d="M 176 180 C 120 180 120 250 180 250" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 336 180 C 392 180 392 250 332 250" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Trophy Stem & Base -->
    <path d="M 244 290 L 268 290 L 274 340 L 238 340 Z" fill="url(#goldGrad)" />
    <path d="M 190 340 L 322 340 L 334 370 L 178 370 Z" fill="url(#goldGrad)" rx="4" />

    <!-- Star Emblem in Trophy -->
    <polygon points="256,180 264,204 290,204 269,219 277,243 256,228 235,243 243,219 222,204 248,204" fill="#ffffff" />
  </g>

  <!-- Esports PRO Controller Badge Text -->
  <rect x="186" y="395" width="140" height="34" rx="17" fill="url(#cyanGrad)" />
  <text x="256" y="418" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="18" fill="#000000" text-anchor="middle" letter-spacing="2">CONTROLLER</text>
</svg>
